openapi: "3.0.1"
info:
  title: "Account and Transaction API"
  description: " This API implements a subset of the [Open Banking](https://www.openbanking.org.uk)\
    \ [Account and Transaction API Profile - v3.1.6](https://openbankinguk.github.io/read-write-api-site3/v3.1.6/profiles/account-and-transaction-api-profile.html)\
    \ which uses [Open Banking Security Profile v1.1.2](https://openbanking.atlassian.net/wiki/spaces/DZ/pages/83919096/Open+Banking+Security+Profile+-+Implementer+s+Draft+v1.1.2).\n\
    # Overview\n\nIn short the steps to get going is as following:\n\n1.  Authorize\
    \ your client with scope **accounts** at the https://s-pankki-api-sandbox.crosskey.io/open-banking/v2.0/oidc/token\
    \ using [OAuth2 client credentials grant](/tutorial#section/Consume-the-APIs/Client-Credentials-Grant)\
    \ and [mutual TLS](/tutorial#section/Consume-the-APIs/Transport-Layer-Security).\n\
    2.  Create the account request at **/account-access-consents**, authorizing your\
    \ client with the access token obtained from step 1, your API key and [mutual\
    \ TLS](/tutorial#section/Consume-the-APIs/Transport-Layer-Security).\n3.  Get\
    \ the consent ID from the response from **/account-access-consents** (step 2)\
    \ and use it to forge openbanking_intent_id using pattern **urn:s-pankki:account:{ConsentId}**.\n\
    4.  Get the end-user's approval using [Hybrid Flow request](/tutorial#section/Consume-the-APIs/OIDC-Hybrid-Flow)\
    \ with Intent ID. For further information, please see [Open Banking Security Profile](https://openbanking.atlassian.net/wiki/spaces/DZ/pages/83919096/Open+Banking+Security+Profile+-+Implementer+s+Draft+v1.1.2#OpenBankingSecurityProfile-Implementer'sDraftv1.1.2-HybridFlowRequestwithIntentId)\
    \ documentation. Note that some banks provide not only redirect authorization\
    \ but also decoupled authorization.\n5.  Exchange your authorization code obtained\
    \ in step 4 for an access token at the https://s-pankki-api-sandbox.crosskey.io/open-banking/v2.0/oidc/token\
    \ using OAuth2 authorization code grant and [mutual TLS](/tutorial#section/Consume-the-APIs/Transport-Layer-Security).\n\
    \nThe access token obtained can now be used to query the accounts APIs.\n\n##\
    \ Permissions\n\nList of currently valid and implemented permissions:\n\n<ul>\
    \ <li><code>ReadAccountsBasic</code> Ability to read basic account information</li>\
    \ <li><code>ReadAccountsDetail</code> Ability to read account identification details</li>\
    \ <li><code>ReadBalances</code> Ability to read <strong>all</strong> balance information</li>\
    \ <li><code>ReadTransactionsBasic</code> Ability to read basic transaction information</li>\
    \ <li><code>ReadTransactionsCredits</code> Ability to read <strong>only</strong>\
    \ credit transactions</li> <li><code>ReadTransactionsDebits</code> Ability to\
    \ read <strong>only</strong> debit transactions</li> <li><code>ReadTransactionsDetail</code>\
    \ Ability to read transaction data elements which may hold silent party details</li>\
    \ </ul>\n\n## Certificates\n\nTo be able to consume this API you will need to\
    \ provide a client certificate to authenticate your application using mutual TLS\
    \ 1.2.\n\nFor more information about setting up your client certificate, see the\
    \ [Get started](/tutorial#section/Set-up-your-certificates) guide.\n\n## Transaction\
    \ access restrictions\n\nAccess to transactions are restricted by the following:\n\
    \n* **Consent restriction** - You can never access transactions outside the boundaries\
    \ of an approved consent.\n\n* **Customer authentication level** - For full access\
    \ you must provide an access token acquired through the [*OIDC Hybrid Flow*](/tutorial#section/Consume-the-APIs/OIDC-Hybrid-Flow).\
    \ The client needs to exchange the authorization code to an access token within\
    \ 30 seconds, and the access token expires after *3 minutes*. When you provide\
    \ an access token acquired using a [*Refresh Token*](/tutorial#section/Consume-the-APIs/Refresh-Token)\
    \ you can only access transactions executed in the *last 90 days*. You can [*re-authenticate*](/tutorial#section/Consume-the-APIs/Consent-re-authentication)\
    \ the consent to regain full access.\n\n* **Request parameters** - If a from date\
    \ and a to date is provided in the request you will only receive transactions\
    \ inside this range. Both parameters are optional, it is possible to request without\
    \ date filtering.\n\nIf you attempt to request outside of the permitted interval\
    \ the API will respond with **403 Forbidden**.\n\n## Account types\nThe supported\
    \ account types in S-Pankki are as follows:\n<table> <thead> <tr> <th>AccountType</th>\
    \ <th>AccountSubType</th> <th>Account.SchemeName</th> </tr> </thead> <tbody> <tr>\
    \ <td>Business</td> <td>CreditCard</td> <td>FI.S-Pankki.CreditCard</td> </tr>\
    \ <tr> <td>Business</td> <td>CurrentAccount</td> <td>UK.OBIE.IBAN</td> </tr> <tr>\
    \ <td>Personal</td> <td>CreditCard</td> <td>FI.S-Pankki.CreditCard</td> </tr>\
    \ <tr> <td>Personal</td> <td>CurrentAccount</td> <td>UK.OBIE.IBAN</td> </tr> </tbody>\
    \ </table>\n\n## Balance Types\nThe supported balance types in S-Pankki are as\
    \ follows:\n<table> <thead> <tr> <th>Parameter</th> <th>BalanceType</th> <th>Description</th>\
    \ </tr> </thead> <tbody> <tr> <td>Data/Balance/Type</td> <td>InterimAvailable</td>\
    \ <td>Available balance calculated in the course of the account servicer's business\
    \ day, at the time specified, and subject to further changes during the business\
    \ day. The interim balance is calculated on the basis of booked credit and debit\
    \ items during the calculation time/period specified. </td> </tr> <tr> <td>Data/Balance/Type</td>\
    \ <td>InterimBooked</td> <td>Balance calculated in the course of the account servicer's\
    \ business day, at the time specified, and subject to further changes during the\
    \ business day. The interim balance is calculated on the basis of booked credit\
    \ and debit items during the calculation time/period specified. </td> </tr> </tbody>\
    \ </table>\n\n# Postman Examples\nDownload and import the **<a target='_blank'\
    \ href='https://archive.crosskey.io/documentation/postman/v2/Crosskey_Open_Banking_API_Example.postman_collection.json'\
    \ download> Postman Collection for OBUK v3.1.6</a>**\nIn this collection we've\
    \ provided prepared requests for interacting with the Open Banking UK APIs. The\
    \ following chapters will help you get started and try out the APIs without any\
    \ own implementations.\n## Structure\nWhen you have imported the collection you\
    \ will notice that we've categorized request into different folders and that the\
    \ requests are numbered, this is to help us reference each request later in this\
    \ section. The reference will follow the pattern **folder#requestNumber**.\n\n\
    ### Folders\n* **--SETUP--:** contains requests for configuring dependencies.\n\
    * **AISP:** contains requests for accounts API.\n* **AUTH:** contains requests\
    \ for the token endpoint and end user authorization.\n\n## Setup\nRequires that\
    \ you've completed following tasks:\n* [Sign up and log in](/tutorial#section/Sign-up-and-log-in)\n\
    * [Set up your certificates - Sandbox certificates](/tutorial#section/Set-up-your-certificates/Sandbox-certificates)\n\
    * [Register your application](/tutorial#section/Register-your-application)\n*\
    \ [Subscribe APIs to your application](/tutorial#section/Subscribe-APIs-to-your-application)\n\
    \n### Configure dependencies\nWe utilize a third-party library in the Postman\
    \ collection to help us create the detached JWS signatures. Interaction with this\
    \ library can be found in **Pre-request Scripts**. The library can be added by\
    \ sending the **GET - Add JS library** request located under **--SETUP--** folder.\n\
    **Note!** This only has to be done once after downloading the collection.\n\n\
    ### Configure client certificate\nThe TLS client certificate does also need to\
    \ be imported which is easily done by going to Postman's Settings &rarr; Certificates\
    \ &rarr; Add Certificate. As the host you may enter **'*'**, while the CRT file\
    \ should point to your TLS Client certificate and the KEY file should point to\
    \ your TLS Client private key.\n\n### Configure collection variables\nThe variables\
    \ can be found when right-clicking and editing the collection.\n\n![alt text](/img/postman/v2/collection_variables.png)\n\
    \n### Variables\n* **x-api-key** and **clientId** can be found after selecting\
    \ an existing application under **[Applications](/applications)**.\n* **store-id**\
    \ The store id of the Third Party Provider. Here we can use *s-pankki*.\n* **callbackUrl**\
    \ one of the predefined redirect URLs for the application. The redirect URL used\
    \ in this tutorial is *https://oauth.pstmn.io/v1/callback* which is intended for\
    \ the Postman desktop application. If you are using Postman in a browser, use\
    \ *https://oauth.pstmn.io/v1/browser-callback* instead. Make sure the URL you\
    \ use is registered as a redirect URL in your Application on the Crosskey portal,\
    \ as the authorization server requires an exact match.\n* **digitalSignaturePrivateKey**\
    \ the private key of the Digital signature certificate.\n* **digitalSignatureCertificateSerialNumber**\
    \ the serial number **in decimal format** of the Digital signature certificate,\
    \ which is found from the Team page related to the application.\n* **digitalSignatureCertificate**\
    \ the public Digital signature certificate.\n\n## End-user authorization\nThis\
    \ request is referenced in below examples as **AUTH#2** and requires some manual\
    \ interactions between Postman and your browser. The request generates a URL,\
    \ to copy into your browser, where you can perform end user authorization. When\
    \ done, you're redirected back to your callback URL where you'll need to extract\
    \ the value from the fragment part code. Save it! as you'll need it for next request,\
    \ where it's provided as a query param.\n### Steps\n1. send the GET request.\n\
    2. open console in Postman.\n3. copy URL from console into your browser. (In this\
    \ example, *store-id* is set to 's-pankki'.)\n\n![alt text](/img/postman/v2/generated_url.png)\n\
    \n4. perform end user authorization. (Authentication credentials for your sandbox\
    \ subscriptions can be found at the [application  page](/applications))\n5. redirected\
    \ back to your callback.\n6. copy value from the callback URL fragment part **code**.\n\
    \n![alt text](/img/postman/callback_url.png)\n\n## Example\nRequires that you've\
    \ completed previous chapters.\n### Request flow\n1. **AUTH#1** retrieve access\
    \ token.\n2. **AISP#1** create account access consent.\n3. **AUTH#2** see [End-user\
    \ authorization](#end-user-authorization).\n4. **AUTH#3** exchange token, with\
    \ **authorization code** as query params.\n5. **AISP#4** fetch accounts. First\
    \ account ID will be stored as a variable in Postman for fetching balances and\
    \ transactions.\n6. **AISP#5** fetch balances.\n7. **AISP#6** fetch transactions.\n\
    8. **AUTH#4** refresh your access token when it has expired (no need to do the\
    \ authorization steps once again for the same user and accounts)."
  version: "v3.1.6"
  x-crosskey-changelog:
    releases:
    - tag: "3.1.6"
      date: "2023-04-18"
      changes:
      - type: "feature"
        name: "New authorization endpoint"
        description: "A new authorization endpoint with improved security profile\
          \ is available at </br><strong>https://s-pankki-sandbox.crosskey.io/open-banking/v4.0/oidc/auth</strong>.\
          \ <br> We strongly recommend to upgrade to the new authorzation endpoint.\
          \ Further documentation is available from Redirect Authorization API (v4.0)."
    - tag: "3.1.6"
      date: "2021-10-05"
      changes:
      - type: "feature"
        name: "New PSD2 rules for SCA exemption"
        description: "From 2023-07-25 the validity of new AISP consents are extended\
          \ from 90 days to 180 days."
      - type: "feature"
        name: "New endpoint"
        description: "API to retrieve the account information resource for a specific\
          \ AccountId is added, </br><strong>GET /accounts/{AccountId}</strong>."
      - type: "feature"
        name: "Paginated responses"
        description: "API response from <strong>/accounts/{AccountId}/transactions</strong>\
          \ is paginated. </br> Links to previous and next page is available from\
          \ the <strong>Links</strong> object in response. Page size is bank specific."
      - type: "breaking"
        name: "Changed signing algorithm"
        description: "Message signing algorithm is changed from <strong>RS256</strong>\
          \ to <strong>PS256</strong>. This applies to both authorization request\
          \ object created by client and id_token returned by authorization server."
      - type: "breaking"
        name: "New token endpoint"
        description: "New token endpoint is </br><strong>https://s-pankki-api-sandbox.crosskey.io/open-banking/v2.0/oidc/token</strong>."
      - type: "breaking"
        name: "New authorization endpoint"
        description: "New authorization endpoint is </br><strong>https://s-pankki-sandbox.crosskey.io/open-banking/v3.0/oidc/auth</strong>."
      - type: "breaking"
        name: "New mandatory parameter"
        description: "Authorization request parameter <strong>nonce</strong> is mandatory."
      - type: "breaking"
        name: "New pattern for openbanking_intent_id"
        description: "Pattern for <strong>openbanking_intent_id</strong> is changed\
          \ from <strong>urn:crosskey:account:{ConsentId}</strong> </br> to <strong>urn:s-pankki:account:{ConsentId}</strong>."
      - type: "breaking"
        name: "Extended validation"
        description: "Request header <strong>x-fapi-customer-ip-address</strong> must\
          \ contain one valid IPv4/IPv6 address if present."
      - type: "improvement"
        name: "Removed request header"
        description: "Request header <strong>x-fapi-financial-id</strong> is no longer\
          \ required."
      - type: "improvement"
        name: "API specification scheme"
        description: "API specification scheme is changed from <strong>Swagger 2.0</strong>\
          \ to <strong>OpenAPI 3.0</strong>."
      - type: "improvement"
        name: "API specification representation"
        description: "API specification representation is changed from <strong>JSON</strong>\
          \ to <strong>YAML</strong>."
servers:
- url: "https://s-pankki-api-sandbox.crosskey.io/open-banking/v3.1.6/aisp"
tags:
- name: "Account Access"
  description: ""
- name: "Accounts"
  description: ""
- name: "Balances"
  description: ""
- name: "Transactions"
  description: ""
paths:
  /account-access-consents:
    post:
      tags:
      - "Account Access"
      summary: "Create Account Access Consents"
      operationId: "CreateAccountAccessConsents"
      parameters:
      - name: "x-fapi-auth-date"
        in: "header"
        description: "The time when the PSU last logged in with the TPP. \nAll dates\
          \ in the HTTP headers are represented as RFC 7231 Full Dates. An example\
          \ is below: \nSun, 10 Sep 2017 19:43:31 UTC"
        required: false
        style: "simple"
        explode: false
        schema:
          type: "string"
          pattern: "^(Mon|Tue|Wed|Thu|Fri|Sat|Sun), \\d{2} (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\
            \ \\d{4} \\d{2}:\\d{2}:\\d{2} (GMT|UTC)$"
      - name: "x-fapi-customer-ip-address"
        in: "header"
        description: "The PSU's IP address if the PSU is currently logged in with\
          \ the TPP."
        required: false
        style: "simple"
        explode: false
        schema:
          type: "string"
      - name: "x-fapi-interaction-id"
        in: "header"
        description: "An RFC4122 UID used as a correlation id."
        required: false
        style: "simple"
        explode: false
        schema:
          type: "string"
      - name: "Authorization"
        in: "header"
        description: "An Authorisation Token as per https://tools.ietf.org/html/rfc6750"
        required: true
        style: "simple"
        explode: false
        schema:
          type: "string"
      - name: "x-customer-user-agent"
        in: "header"
        description: "Indicates the user-agent that the PSU is using."
        required: false
        style: "simple"
        explode: false
        schema:
          type: "string"
      requestBody:
        description: "Default"
        content:
          application/json; charset=utf-8:
            schema:
              $ref: "#/components/schemas/OBReadConsent1"
          application/json:
            schema:
              $ref: "#/components/schemas/OBReadConsent1"
          application/jose+jwe:
            schema:
              $ref: "#/components/schemas/OBReadConsent1"
        required: true
      responses:
        "201":
          description: "Account Access Consents Created"
          headers:
            x-fapi-interaction-id:
              description: "An RFC4122 UID used as a correlation id."
              style: "simple"
              explode: false
              schema:
                type: "string"
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/OBReadConsentResponse1"
            application/json:
              schema:
                $ref: "#/components/schemas/OBReadConsentResponse1"
            application/jose+jwe:
              schema:
                $ref: "#/components/schemas/OBReadConsentResponse1"
        "400":
          description: "Bad request"
          headers:
            x-fapi-interaction-id:
              description: "An RFC4122 UID used as a correlation id."
              style: "simple"
              explode: false
              schema:
                type: "string"
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/OBErrorResponse1"
            application/json:
              schema:
                $ref: "#/components/schemas/OBErrorResponse1"
            application/jose+jwe:
              schema:
                $ref: "#/components/schemas/OBErrorResponse1"
        "401":
          description: "Unauthorized"
          headers:
            x-fapi-interaction-id:
              description: "An RFC4122 UID used as a correlation id."
              style: "simple"
              explode: false
              schema:
                type: "string"
          content: {}
        "403":
          description: "Forbidden"
          headers:
            x-fapi-interaction-id:
              description: "An RFC4122 UID used as a correlation id."
              style: "simple"
              explode: false
              schema:
                type: "string"
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/OBErrorResponse1"
            application/json:
              schema:
                $ref: "#/components/schemas/OBErrorResponse1"
            application/jose+jwe:
              schema:
                $ref: "#/components/schemas/OBErrorResponse1"
        "405":
          description: "Method Not Allowed"
          headers:
            x-fapi-interaction-id:
              description: "An RFC4122 UID used as a correlation id."
              style: "simple"
              explode: false
              schema:
                type: "string"
          content: {}
        "406":
          description: "Not Acceptable"
          headers:
            x-fapi-interaction-id:
              description: "An RFC4122 UID used as a correlation id."
              style: "simple"
              explode: false
              schema:
                type: "string"
          content: {}
        "415":
          description: "Unsupported Media Type"
          headers:
            x-fapi-interaction-id:
              description: "An RFC4122 UID used as a correlation id."
              style: "simple"
              explode: false
              schema:
                type: "string"
          content: {}
        "429":
          description: "Too Many Requests </br> The operation was refused as too many\
            \ requests have been made within a certain timeframe"
          headers:
            x-fapi-interaction-id:
              description: "An RFC4122 UID used as a correlation id."
              style: "simple"
              explode: false
              schema:
                type: "string"
            Retry-After:
              description: "Number in seconds to wait"
              style: "simple"
              explode: false
              schema:
                type: "integer"
          content: {}
        "500":
          description: "Internal Server Error"
          headers:
            x-fapi-interaction-id:
              description: "An RFC4122 UID used as a correlation id."
              style: "simple"
              explode: false
              schema:
                type: "string"
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/OBErrorResponse1"
            application/json:
              schema:
                $ref: "#/components/schemas/OBErrorResponse1"
            application/jose+jwe:
              schema:
                $ref: "#/components/schemas/OBErrorResponse1"
      security:
      - APIKey: []
        TPPOAuth2Security:
        - "accounts"
      x-codegen-request-body-name: "OBReadConsent1Param"
