          format: "date-time"
      - name: "toBookingDateTime"
        in: "query"
        description: "The UTC ISO 8601 Date Time to filter transactions TO\nNB Time\
          \ component is optional - set to 00:00:00 for just Date.\nIf the Date Time\
          \ contains a timezone, the ASPSP must ignore the timezone component."
        required: false
        style: "form"
        explode: true
        schema:
          type: "string"
          format: "date-time"
      - name: "paginationKey"
        in: "query"
        description: "The pagination key"
        required: false
        style: "form"
        explode: true
        schema:
          type: "string"
      responses:
        "200":
          description: "Transactions Read"
          headers:
            x-fapi-interaction-id:
              description: "An RFC4122 UID used as a correlation id."
              style: "simple"
              explode: false
              schema:
                type: "string"
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/OBReadTransaction6"
            application/json:
              schema:
                $ref: "#/components/schemas/OBReadTransaction6"
            application/jose+jwe:
              schema:
                $ref: "#/components/schemas/OBReadTransaction6"
        "400":
          description: "Bad request"
          headers:
            x-fapi-interaction-id:
              description: "An RFC4122 UID used as a correlation id."
              style: "simple"
              explode: false
              schema:
                type: "string"
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/OBErrorResponse1"
            application/json:
              schema:
                $ref: "#/components/schemas/OBErrorResponse1"
            application/jose+jwe:
              schema:
                $ref: "#/components/schemas/OBErrorResponse1"
        "401":
          description: "Unauthorized"
          headers:
            x-fapi-interaction-id:
              description: "An RFC4122 UID used as a correlation id."
              style: "simple"
              explode: false
              schema:
                type: "string"
          content: {}
        "403":
          description: "Forbidden"
          headers:
            x-fapi-interaction-id:
              description: "An RFC4122 UID used as a correlation id."
              style: "simple"
              explode: false
              schema:
                type: "string"
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/OBErrorResponse1"
            application/json:
              schema:
                $ref: "#/components/schemas/OBErrorResponse1"
            application/jose+jwe:
              schema:
                $ref: "#/components/schemas/OBErrorResponse1"
        "405":
          description: "Method Not Allowed"
          headers:
            x-fapi-interaction-id:
              description: "An RFC4122 UID used as a correlation id."
              style: "simple"
              explode: false
              schema:
                type: "string"
          content: {}
        "406":
          description: "Not Acceptable"
          headers:
            x-fapi-interaction-id:
              description: "An RFC4122 UID used as a correlation id."
              style: "simple"
              explode: false
              schema:
                type: "string"
          content: {}
        "429":
          description: "Too Many Requests </br> The operation was refused as too many\
            \ requests have been made within a certain timeframe"
          headers:
            x-fapi-interaction-id:
              description: "An RFC4122 UID used as a correlation id."
              style: "simple"
              explode: false
              schema:
                type: "string"
            Retry-After:
              description: "Number in seconds to wait"
              style: "simple"
              explode: false
              schema:
                type: "integer"
          content: {}
        "500":
          description: "Internal Server Error"
          headers:
            x-fapi-interaction-id:
              description: "An RFC4122 UID used as a correlation id."
              style: "simple"
              explode: false
              schema:
                type: "string"
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/OBErrorResponse1"
            application/json:
              schema:
                $ref: "#/components/schemas/OBErrorResponse1"
            application/jose+jwe:
              schema:
                $ref: "#/components/schemas/OBErrorResponse1"
      security:
      - APIKey: []
        PSUOAuth2Security:
        - "accounts"
components:
  schemas:
    AccountId:
      type: "string"
      description: "A unique and immutable identifier used to identify the account\
        \ resource. This identifier has no meaning to the account owner."
      maxLength: 40
      minLength: 1
    ActiveOrHistoricCurrencyCode_0:
      type: "string"
      description: "Identification of the currency in which the account is held. \n\
        Usage: Currency should only be used in case one and the same account number\
        \ covers several currencies\nand the initiating party needs to identify which\
        \ currency needs to be used for settlement on the account."
      pattern: "^[A-Z]{3,3}$"
    ActiveOrHistoricCurrencyCode_1:
      type: "string"
      description: "A code allocated to a currency by a Maintenance Agency under an\
        \ international identification scheme, as described in the latest edition\
        \ of the international standard ISO 4217 \"Codes for the representation of\
        \ currencies and funds\"."
      pattern: "^[A-Z]{3,3}$"
    AddressLine:
      type: "string"
      description: "Information that locates and identifies a specific address for\
        \ a transaction entry, that is presented in free format text."
      maxLength: 70
      minLength: 1
    BookingDateTime:
      type: "string"
      format: "date-time"
      description: "Date and time when a transaction entry is posted to an account\
        \ on the account servicer's books.\nUsage: Booking date is the expected booking\
        \ date, unless the status is booked, in which case it is the actual booking\
        \ date.All dates in the JSON payloads are represented in ISO 8601 date-time\
        \ format. \nAll date-time fields in responses must include the timezone. An\
        \ example is below:\n2017-04-05T10:43:07+00:00"
    BuildingNumber:
      type: "string"
      description: "Number that identifies the position of a building on a street."
      maxLength: 16
      minLength: 1
    CreationDateTime:
      type: "string"
      format: "date-time"
      description: "Date and time at which the resource was created.All dates in the\
        \ JSON payloads are represented in ISO 8601 date-time format. \nAll date-time\
        \ fields in responses must include the timezone. An example is below:\n2017-04-05T10:43:07+00:00"
    Description_0:
      type: "string"
      description: "Specifies the description of the account type."
      maxLength: 35
      minLength: 1
    ISODateTime:
      type: "string"
      format: "date-time"
      description: "All dates in the JSON payloads are represented in ISO 8601 date-time\
        \ format. \nAll date-time fields in responses must include the timezone. An\
        \ example is below:\n2017-04-05T10:43:07+00:00"
    Identification_0:
      type: "string"
      description: "Identification assigned by an institution to identify an account.\
        \ This identification is known by the account owner."
      maxLength: 256
      minLength: 1
    Identification_1:
      type: "string"
      description: "Unique and unambiguous identification of the servicing institution."
      maxLength: 35
      minLength: 1
    Identification_2:
      type: "string"
      description: "Unique and unambiguous identification of a financial institution\
        \ or a branch of a financial institution."
      maxLength: 35
      minLength: 1
    Links:
      type: "object"
      description: "Links relevant to the payload"
      properties:
        Self:
          type: "string"
          format: "uri"
        First:
          type: "string"
          format: "uri"
        Prev:
          type: "string"
          format: "uri"
        Next:
          type: "string"
          format: "uri"
        Last:
          type: "string"
          format: "uri"
      required:
      - "Self"
    MaturityDate:
      type: "string"
      format: "date-time"
      description: "Maturity date of the account.All dates in the JSON payloads are\
        \ represented in ISO 8601 date-time format. \nAll date-time fields in responses\
        \ must include the timezone. An example is below:\n2017-04-05T10:43:07+00:00"
    Meta:
      type: "object"
      description: "Meta Data relevant to the payload"
      properties:
        TotalPages:
          type: "integer"
          format: "int32"
        FirstAvailableDateTime:
          $ref: "#/components/schemas/ISODateTime"
        LastAvailableDateTime:
          $ref: "#/components/schemas/ISODateTime"
      title: "MetaData"
    Name_0:
      type: "string"
      description: "The account name is the name or names of the account owner(s)\
        \ represented at an account level, as displayed by the ASPSP's online channels.\n\
        Note, the account name is not the product name or the nickname of the account."
      maxLength: 350
      minLength: 1
    Name_1:
      type: "string"
      description: "Name by which an agent is known and which is usually used to identify\
        \ that agent."
      maxLength: 140
      minLength: 1
    Nickname:
      type: "string"
      description: "The nickname of the account, assigned by the account owner in\
        \ order to provide an additional means of identification of the account."
      maxLength: 70
      minLength: 1
    OBAccount6:
      type: "object"
      description: "Unambiguous identification of the account to which credit and\
        \ debit entries are made."
      properties:
        AccountId:
          $ref: "#/components/schemas/AccountId"
        Status:
          $ref: "#/components/schemas/OBAccountStatus1Code"
        StatusUpdateDateTime:
          $ref: "#/components/schemas/StatusUpdateDateTime"
        Currency:
          $ref: "#/components/schemas/ActiveOrHistoricCurrencyCode_0"
        AccountType:
          $ref: "#/components/schemas/OBExternalAccountType1Code"
        AccountSubType:
          $ref: "#/components/schemas/OBExternalAccountSubType1Code"
        Description:
          $ref: "#/components/schemas/Description_0"
        Nickname:
          $ref: "#/components/schemas/Nickname"
        OpeningDate:
          $ref: "#/components/schemas/OpeningDate"
        MaturityDate:
          $ref: "#/components/schemas/MaturityDate"
        SwitchStatus:
          $ref: "#/components/schemas/OBExternalSwitchStatusCode"
        Account:
          type: "array"
          items:
            type: "object"
            description: "Provides the details to identify an account."
            properties:
              SchemeName:
                $ref: "#/components/schemas/OBExternalAccountIdentification4Code"
              Identification:
                $ref: "#/components/schemas/Identification_0"
              Name:
                $ref: "#/components/schemas/Name_0"
              SecondaryIdentification:
                $ref: "#/components/schemas/SecondaryIdentification"
            required:
            - "Identification"
            - "SchemeName"
        Servicer:
          $ref: "#/components/schemas/OBBranchAndFinancialInstitutionIdentification5_0"
      required:
      - "AccountId"
      - "AccountSubType"
      - "AccountType"
      - "Currency"
    OBAccountStatus1Code:
      type: "string"
      description: "Specifies the status of account resource in code form."
      enum:
      - "Deleted"
      - "Disabled"
      - "Enabled"
      - "Pending"
      - "ProForma"
    OBActiveCurrencyAndAmount_SimpleType:
      type: "string"
      description: "A number of monetary units specified in an active currency where\
        \ the unit of currency is explicit and compliant with ISO 4217."
      pattern: "^\\d{1,13}$|^\\d{1,13}\\.\\d{1,5}$"
    OBActiveOrHistoricCurrencyAndAmount_10:
      type: "object"
      description: "Transaction charges to be paid by the charge bearer."
      properties:
        Amount:
          $ref: "#/components/schemas/OBActiveCurrencyAndAmount_SimpleType"
        Currency:
          $ref: "#/components/schemas/ActiveOrHistoricCurrencyCode_1"
      required:
      - "Amount"
      - "Currency"
    OBActiveOrHistoricCurrencyAndAmount_9:
      type: "object"
      description: "Amount of money in the cash transaction entry."
      properties:
        Amount:
          $ref: "#/components/schemas/OBActiveCurrencyAndAmount_SimpleType"
        Currency:
          $ref: "#/components/schemas/ActiveOrHistoricCurrencyCode_1"
      required:
      - "Amount"
      - "Currency"
    OBAddressTypeCode:
      type: "string"
      description: "Identifies the nature of the postal address."
      enum:
      - "Business"
      - "Correspondence"
      - "DeliveryTo"
      - "MailTo"
      - "POBox"
      - "Postal"
      - "Residential"
      - "Statement"
    OBBalanceType1Code:
      type: "string"
      description: "Balance type, in a coded form."
      enum:
      - "ClosingAvailable"
      - "ClosingBooked"
      - "ClosingCleared"
      - "Expected"
      - "ForwardAvailable"
      - "Information"
      - "InterimAvailable"
      - "InterimBooked"
      - "InterimCleared"
      - "OpeningAvailable"
      - "OpeningBooked"
      - "OpeningCleared"
      - "PreviouslyClosedBooked"
    OBBankTransactionCodeStructure1:
      type: "object"
      description: "Set of elements used to fully identify the type of underlying\
        \ transaction resulting in an entry."
      properties:
        Code:
          type: "string"
          description: "Specifies the family within a domain."
          maxLength: 4
          minLength: 1
        SubCode:
          type: "string"
          description: "Specifies the sub-product family within a specific family."
          maxLength: 4
          minLength: 1
      required:
      - "Code"
      - "SubCode"
    OBBranchAndFinancialInstitutionIdentification5_0:
      type: "object"
      description: "Party that manages the account on behalf of the account owner,\
        \ that is manages the registration and booking of entries on the account,\
        \ calculates balances on the account and provides information about the account."
      properties:
        SchemeName:
          $ref: "#/components/schemas/OBExternalFinancialInstitutionIdentification4Code"
        Identification:
          $ref: "#/components/schemas/Identification_1"
      required:
      - "Identification"
      - "SchemeName"
    OBBranchAndFinancialInstitutionIdentification6_1:
      type: "object"
      description: "Financial institution servicing an account for the creditor."
      properties:
        SchemeName:
          $ref: "#/components/schemas/OBExternalFinancialInstitutionIdentification4Code"
        Identification:
          $ref: "#/components/schemas/Identification_2"
        Name:
          $ref: "#/components/schemas/Name_1"
        PostalAddress:
          $ref: "#/components/schemas/OBPostalAddress6"
    OBBranchAndFinancialInstitutionIdentification6_2:
      type: "object"
      description: "Financial institution servicing an account for the debtor."
      properties:
        SchemeName:
          $ref: "#/components/schemas/OBExternalFinancialInstitutionIdentification4Code"
        Identification:
          $ref: "#/components/schemas/Identification_2"
        Name:
          $ref: "#/components/schemas/Name_1"
        PostalAddress:
          $ref: "#/components/schemas/OBPostalAddress6"
    OBCashAccount6_0:
      type: "object"
      description: "Unambiguous identification of the account of the creditor, in\
        \ the case of a debit transaction."
      properties:
        SchemeName:
          $ref: "#/components/schemas/OBExternalAccountIdentification4Code"
        Identification:
          $ref: "#/components/schemas/Identification_0"
        Name:
          $ref: "#/components/schemas/Name_0"
        SecondaryIdentification:
          $ref: "#/components/schemas/SecondaryIdentification"
    OBCashAccount6_1:
      type: "object"
      description: "Unambiguous identification of the account of the debtor, in the\
        \ case of a crebit transaction."
      properties:
        SchemeName:
          $ref: "#/components/schemas/OBExternalAccountIdentification4Code"
        Identification:
          $ref: "#/components/schemas/Identification_0"
        Name:
          $ref: "#/components/schemas/Name_0"
        SecondaryIdentification:
          $ref: "#/components/schemas/SecondaryIdentification"
    OBCreditDebitCode_1:
      type: "string"
      description: "Indicates whether the transaction is a credit or a debit entry."
      enum:
      - "Credit"
      - "Debit"
    OBCreditDebitCode_2:
      type: "string"
      description: "Indicates whether the balance is a credit or a debit balance.\
        \ \nUsage: A zero balance is considered to be a credit balance."
      enum:
      - "Credit"
      - "Debit"
    OBCurrencyExchange5:
      type: "object"
      description: "Set of elements used to provide details on the currency exchange."
      properties:
        SourceCurrency:
          type: "string"
          description: "Currency from which an amount is to be converted in a currency\
            \ conversion."
          pattern: "^[A-Z]{3,3}$"
        TargetCurrency:
          type: "string"
          description: "Currency into which an amount is to be converted in a currency\
            \ conversion."
          pattern: "^[A-Z]{3,3}$"
        UnitCurrency:
          type: "string"
          description: "Currency in which the rate of exchange is expressed in a currency\
            \ exchange. In the example 1GBP = xxxCUR, the unit currency is GBP."
          pattern: "^[A-Z]{3,3}$"
        ExchangeRate:
          type: "number"
          description: "Factor used to convert an amount from one currency into another.\
            \ This reflects the price at which one currency was bought with another\
            \ currency.\nUsage: ExchangeRate expresses the ratio between UnitCurrency\
            \ and QuotedCurrency (ExchangeRate = UnitCurrency/QuotedCurrency)."
        ContractIdentification:
          type: "string"
          description: "Unique identification to unambiguously identify the foreign\
            \ exchange contract."
          maxLength: 35
          minLength: 1
        QuotationDate:
          type: "string"
          format: "date-time"
          description: "Date and time at which an exchange rate is quoted.All dates\
            \ in the JSON payloads are represented in ISO 8601 date-time format. \n\
            All date-time fields in responses must include the timezone. An example\
            \ is below:\n2017-04-05T10:43:07+00:00"
        InstructedAmount:
          type: "object"
          description: "Amount of money to be moved between the debtor and creditor,\
            \ before deduction of charges, expressed in the currency as ordered by\
            \ the initiating party."
          properties:
            Amount:
              $ref: "#/components/schemas/OBActiveCurrencyAndAmount_SimpleType"
            Currency:
              $ref: "#/components/schemas/ActiveOrHistoricCurrencyCode_1"
          required:
          - "Amount"
          - "Currency"
      required:
      - "ExchangeRate"
      - "SourceCurrency"
    OBEntryStatus1Code:
      type: "string"
      description: "Status of a transaction entry on the books of the account servicer."
      enum:
      - "Booked"
      - "Pending"
    OBTransactionMutability1Code:
      type: "string"
      description: "Specifies the Mutability of the Transaction record."
      enum:
      - "Mutable"
      - "Immutable"
    OBError1:
      type: "object"
      properties:
        ErrorCode:
          type: "string"
          description: "Low level textual error code, e.g., UK.OBIE.Field.Missing"
          x-namespaced-enum:
          - "UK.OBIE.Field.Expected"
          - "UK.OBIE.Field.Invalid"
          - "UK.OBIE.Field.InvalidDate"
          - "UK.OBIE.Field.Missing"
          - "UK.OBIE.Field.Unexpected"
          - "UK.OBIE.Header.Invalid"
          - "UK.OBIE.Header.Missing"
          - "UK.OBIE.Reauthenticate"
          - "UK.OBIE.Resource.ConsentMismatch"
          - "UK.OBIE.Resource.InvalidConsentStatus"
          - "UK.OBIE.Resource.InvalidFormat"
          - "UK.OBIE.Resource.NotFound"
          - "UK.OBIE.Rules.AfterCutOffDateTime"
          - "UK.OBIE.Rules.DuplicateReference"
          - "UK.OBIE.Signature.Invalid"
          - "UK.OBIE.Signature.InvalidClaim"
          - "UK.OBIE.Signature.Malformed"
          - "UK.OBIE.Signature.Missing"
          - "UK.OBIE.Signature.MissingClaim"
          - "UK.OBIE.Signature.Unexpected"
          - "UK.OBIE.UnexpectedError"
          - "UK.OBIE.Unsupported.AccountIdentifier"
          - "UK.OBIE.Unsupported.AccountSecondaryIdentifier"
          - "UK.OBIE.Unsupported.Currency"
          - "UK.OBIE.Unsupported.Frequency"
          - "UK.OBIE.Unsupported.LocalInstrument"
          - "UK.OBIE.Unsupported.Scheme"
        Message:
          type: "string"
          description: "A description of the error that occurred. e.g., 'A mandatory\
            \ field isn't supplied' or 'RequestedExecutionDateTime must be in future'\n\
            OBIE doesn't standardise this field"
          maxLength: 500
          minLength: 1
        Path:
          type: "string"
          description: "Recommended but optional reference to the JSON Path of the\
            \ field with error, e.g., Data.Initiation.InstructedAmount.Currency"
          maxLength: 500
          minLength: 1
        Url:
          type: "string"
          description: "URL to help remediate the problem, or provide more information,\
            \ or to API Reference, or help etc"
      required:
      - "ErrorCode"
      - "Message"
    OBErrorResponse1:
      type: "object"
      description: "An array of detail error codes, and messages, and URLs to documentation\
        \ to help remediation."
      properties:
        Code:
          type: "string"
          description: "High level textual error code, to help categorize the errors."
          maxLength: 40
          minLength: 1
        Id:
          type: "string"
          description: "A unique reference for the error instance, for audit purposes,\
            \ in case of unknown/unclassified errors."
          maxLength: 40
          minLength: 1
        Message:
          type: "string"
          description: "Brief Error message, e.g., 'There is something wrong with\
            \ the request parameters provided'"
          maxLength: 500
          minLength: 1
        Errors:
          type: "array"
          items:
            $ref: "#/components/schemas/OBError1"
          minItems: 1
      required:
      - "Code"
      - "Errors"
      - "Message"
    OBExternalAccountIdentification4Code:
      type: "string"
      description: "Name of the identification scheme, in a coded form as published\
        \ in an external list."
      x-namespaced-enum:
      - "UK.OBIE.BBAN"
      - "UK.OBIE.IBAN"
      - "UK.OBIE.PAN"
      - "UK.OBIE.Paym"
      - "UK.OBIE.SortCodeAccountNumber"
    OBExternalAccountSubType1Code:
      type: "string"
      description: "Specifies the sub type of account (product family group)."
      enum:
      - "ChargeCard"
      - "CreditCard"
      - "CurrentAccount"
      - "EMoney"
      - "Loan"
      - "Mortgage"
      - "PrePaidCard"
      - "Savings"
    OBExternalAccountType1Code:
      type: "string"
      description: "Specifies the type of account (personal or business)."
      enum:
      - "Business"
      - "Personal"
    OBExternalFinancialInstitutionIdentification4Code:
      type: "string"
      description: "Name of the identification scheme, in a coded form as published\
        \ in an external list."
      x-namespaced-enum:
      - "UK.OBIE.BICFI"
    OBExternalSwitchStatusCode:
      type: "string"
      description: "Specifies the switch status for the account, in a coded form."
      x-namespaced-enum:
      - "UK.CASS.NotSwitced"
      - "UK.CASS.SwitchCompleted"
    OBMerchantDetails1:
      type: "object"
      description: "Details of the merchant involved in the transaction."
      properties:
        MerchantName:
          type: "string"
          description: "Name by which the merchant is known."
          maxLength: 350
          minLength: 1
        MerchantCategoryCode:
          type: "string"
          description: "Category code conform to ISO 18245, related to the type of\
            \ services or goods the merchant provides for the transaction."
          maxLength: 4
          minLength: 3
    OBPostalAddress6:
      type: "object"
      description: "Information that locates and identifies a specific address, as\
        \ defined by postal services."
      properties:
        AddressType:
          $ref: "#/components/schemas/OBAddressTypeCode"
        Department:
          type: "string"
          description: "Identification of a division of a large organisation or building."
          maxLength: 70
          minLength: 1
        SubDepartment:
          type: "string"
          description: "Identification of a sub-division of a large organisation or\
            \ building."
          maxLength: 70
          minLength: 1
        StreetName:
          $ref: "#/components/schemas/StreetName"
        BuildingNumber:
          $ref: "#/components/schemas/BuildingNumber"
        PostCode:
          $ref: "#/components/schemas/PostCode"
        TownName:
          $ref: "#/components/schemas/TownName"
        CountrySubDivision:
          type: "string"
          description: "Identifies a subdivision of a country such as state, region,\
            \ county."
          maxLength: 35
          minLength: 1
        Country:
          type: "string"
          description: "Nation with its own government."
          pattern: "^[A-Z]{2,2}$"
        AddressLine:
          type: "array"
          items:
            type: "string"
            description: "Information that locates and identifies a specific address,\
              \ as defined by postal services, presented in free format text."
            maxLength: 70
            minLength: 1
          maxItems: 7
          minItems: 0
    OBReadAccount6:
      type: "object"
      properties:
        Data:
          type: "object"
          properties:
            Account:
              type: "array"
              items:
                $ref: "#/components/schemas/OBAccount6"
        Links:
          $ref: "#/components/schemas/Links"
        Meta:
          $ref: "#/components/schemas/Meta"
      required:
      - "Data"
    OBReadBalance1:
      type: "object"
      properties:
        Data:
          type: "object"
          properties:
            Balance:
              type: "array"
              items:
                type: "object"
                description: "Set of elements used to define the balance details."
                properties:
                  AccountId:
                    $ref: "#/components/schemas/AccountId"
