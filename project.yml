name: SpankkiSandbox
options:
  bundleIdPrefix: fi.triona
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: DRM6RX29P7
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SpankkiSandbox:
    type: application
    platform: iOS
    sources:
      - path: SpankkiSandbox
    info:
      path: SpankkiSandbox/Info.plist
      properties:
        CFBundleDisplayName: S-Pankki Sandbox
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: Connects to your S-Pankki sandbox server running on your Mac.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.triona.spankkisandbox
        TARGETED_DEVICE_FAMILY: "1"
