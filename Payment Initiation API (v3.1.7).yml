                    \ party for an instructed party to unambiguously identify the\
                    \ instruction.\nUsage: the  instruction identification is a point\
                    \ to point reference that can be used between the instructing\
                    \ party and the instructed party to refer to the individual instruction.\
                    \ It can be included in several messages related to the instruction."
                  maxLength: 35
                  minLength: 1
                EndToEndIdentification:
                  type: "string"
                  description: "Unique identification assigned by the initiating party\
                    \ to unambiguously identify the transaction. This identification\
                    \ is passed on, unchanged, throughout the entire end-to-end chain.\n\
                    Usage: The end-to-end identification can be used for reconciliation\
                    \ or to link tasks relating to the transaction. It can be included\
                    \ in several messages related to the transaction.\nOB: The Faster\
                    \ Payments Scheme can only access 31 characters for the EndToEndIdentification\
                    \ field."
                  maxLength: 35
                  minLength: 1
                LocalInstrument:
                  $ref: "#/components/schemas/OBExternalLocalInstrument1Code"
                InstructionPriority:
                  type: "string"
                  description: "Indicator of the urgency or order of importance that\
                    \ the instructing party would like the instructed party to apply\
                    \ to the processing of the instruction."
                  enum:
                  - "Normal"
                  - "Urgent"
                Purpose:
                  type: "string"
                  description: "Specifies the external purpose code in the format\
                    \ of character string with a maximum length of 4 characters.\n\
                    The list of valid codes is an external code list published separately.\n\
                    External code sets can be downloaded from www.iso20022.org."
                  maxLength: 4
                  minLength: 1
                ExtendedPurpose:
                  type: "string"
                  description: "Specifies the purpose of an international payment,\
                    \ when there is no corresponding 4 character code available in\
                    \ the ISO20022 list of Purpose Codes."
                  maxLength: 140
                  minLength: 1
                ChargeBearer:
                  $ref: "#/components/schemas/OBChargeBearerType1Code"
                RequestedExecutionDateTime:
                  type: "string"
                  format: "date-time"
                  description: "Date at which the initiating party requests the clearing\
                    \ agent to process the payment. \nUsage: This is the date on which\
                    \ the debtor's account is to be debited.All dates in the JSON\
                    \ payloads are represented in ISO 8601 date-time format. \nAll\
                    \ date-time fields in responses must include the timezone. An\
                    \ example is below:\n2017-04-05T10:43:07+00:00"
