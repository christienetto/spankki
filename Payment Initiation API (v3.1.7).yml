              maxLength: 128
              minLength: 1
            Initiation:
              type: "object"
              description: "The Initiation payload is sent by the initiating party\
                \ to the ASPSP. It is used to request movement of funds from the debtor\
                \ account to a creditor for an international standing order."
              properties:
                Frequency:
                  type: "string"
                  description: "* EVERY_MONTH - Once a month\n* EVERY_MONTH_LAST_BANKDAY\
                    \ - Last banking day each month"
                  pattern: "^(EVERY_MONTH|EVERY_MONTH_LAST_BANKDAY)$"
                Reference:
                  type: "string"
                  description: "Unique reference, as assigned by the creditor, to\
                    \ unambiguously refer to the payment transaction.\nUsage: If available,\
                    \ the initiating party should provide this reference in the structured\
                    \ remittance information, to enable reconciliation by the creditor\
                    \ upon receipt of the amount of money.\nIf the business context\
                    \ requires the use of a creditor reference or a payment remit\
                    \ identification, and only one identifier can be passed through\
                    \ the end-to-end chain, the creditor's reference or payment remittance\
                    \ identification should be quoted in the end-to-end transaction\
                    \ identification."
                  maxLength: 35
                  minLength: 1
                Unstructured:
                  type: "string"
                  description: "Information supplied to enable the matching/reconciliation\
                    \ of an entry with the items that the payment is intended to settle,\
                    \ such as commercial invoices in an accounts' receivable system,\
                    \ in an unstructured form."
                  maxLength: 140
                  minLength: 1
