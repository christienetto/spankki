openapi: "3.0.1"
info:
  title: "Payment Initiation API"
  description: "This API implements a subset of the [Open Banking](https://www.openbanking.org.uk)\
    \ [Payment Initiation API Profile - v3.1.6](https://openbankinguk.github.io/read-write-api-site3/v3.1.6/profiles/payment-initiation-api-profile.html)\
    \ which uses [Open Banking Security Profile v1.1.2](https://openbanking.atlassian.net/wiki/spaces/DZ/pages/83919096/Open+Banking+Security+Profile+-+Implementer+s+Draft+v1.1.2).\n\
    # Overview\n\nIn short the steps to get going is as following:\n\n1.  Authorize\
    \ your client with scope **payments**  at the https://s-pankki-api-sandbox.crosskey.io/open-banking/v2.0/oidc/token\
    \ using [OAuth2 client credentials grant](/tutorial#section/Consume-the-APIs/Client-Credentials-Grant)\
    \ and [mutual TLS](/tutorial#section/Consume-the-APIs/Transport-Layer-Security).\n\
    2.  Create the payment consent, authorizing your client with the access token\
    \ obtained from step 1, your API key and [mutual TLS](/tutorial#section/Consume-the-APIs/Transport-Layer-Security).\n\
    3.  Get the consent ID from the response in step 2 and use it to forge openbanking_intent_id\
    \ using pattern **urn:s-pankki:payment:{CONSENT_ID}**.\n4.  Get the end-user's\
    \ approval using [Hybrid Flow request](/tutorial#section/Consume-the-APIs/OIDC-Hybrid-Flow)\
    \ with Intent ID. For further information, please see [Open Banking Security Profile](https://openbanking.atlassian.net/wiki/spaces/DZ/pages/83919096/Open+Banking+Security+Profile+-+Implementer+s+Draft+v1.1.2#OpenBankingSecurityProfile-Implementer'sDraftv1.1.2-HybridFlowRequestwithIntentId)\
    \ documentation.\n5.  Exchange your authorization code obtained in step 4 for\
    \ an access token at the https://s-pankki-api-sandbox.crosskey.io/open-banking/v2.0/oidc/token\
    \ using OAuth2 authorization code grant and [mutual TLS](/tutorial#section/Consume-the-APIs/Transport-Layer-Security).\n\
    \nThe access token obtained can now be used to create a payment APIs.\n\n## Message\
    \ signing\n\n*   All POST requests must be signed.\n*   All responses returned\
    \ by the API are signed. The public key to validate responses is accessible from\
    \ https://s-pankki-api-sandbox.crosskey.io/open-banking/v1.0/oidc/jwks.\n*   PS256\
    \ signing algorithm must be used for every signed request and response.\n\nFor\
    \ more information about setting up your signing certificate, see the [Get started](/tutorial#section/Set-up-your-certificates)\
    \ guide.\n\n## Certificates\n\nTo be able to consume this API you will need to\
    \ provide a client certificate to authenticate your application using mutual TLS\
    \ 1.2.\n\nFor more information about setting up your client certificate, see the\
    \ [Get started](/tutorial#section/Set-up-your-certificates) guide.\n\n# Postman\
    \ Examples\nDownload and import the **<a target=\"_blank\" href=\"https://archive.crosskey.io/documentation/postman/v2/Crosskey_Open_Banking_API_Example.postman_collection.json\"\
    \ download>Postman Collection for OBUK v3.1.6</a>**\n\nIn this collection we've\
    \ provided prepared requests for interacting with the Open Banking UK APIs. The\
    \ following chapters will help you get started and try out the APIs without any\
    \ own implementations.\n\n## Structure\nWhen you have imported the collection\
    \ you will notice that we've categorized request into different folders and that\
    \ the requests are numbered, this is to help us reference each request later in\
    \ this section. The reference will follow the pattern **folder#requestNumber**.\
    \ For example, the create international-payment-consents will be referenced as\
    \ **PISP#1**.\n\n### Folders\n*   **--SETUP--:** contains requests for configuring\
    \ dependencies.\n*   **PISP:** contains requests for the payments API.\n*   **AUTH:**\
    \ contains requests for the token endpoint and end user authorization.\n\n## Setup\n\
    Requires that you've completed following tasks:\n*   [Sign up and log in](/tutorial#section/Sign-up-and-log-in)\n\
    *   [Set up your certificates - Sandbox certificates](/tutorial#section/Set-up-your-certificates/Sandbox-certificates)\n\
    *   [Register your application](/tutorial#section/Register-your-application)\n\
    *   [Subscribe APIs to your application](/tutorial#section/Subscribe-APIs-to-your-application)\n\
    \n### Configure dependencies\nWe utilize a third-party library in the Postman\
    \ collection to help us create the detached JWS signatures. Interaction with this\
    \ library can be found in **Pre-request Scripts**. The library can be added by\
    \ sending the **GET - Add JS library** request located under **--SETUP--** folder.\n\
    \n**Note!** This only has to be done once after downloading the collection.\n\n\
    ### Configure client certificate\nThe TLS client certificate does also need to\
    \ be imported which is easily done by going to Postman's Settings &rarr; Certificates\
    \ &rarr; Add Certificate. As the host you may enter **'*'**, while the CRT file\
    \ should point to your TLS Client certificate and the KEY file should point to\
    \ your TLS Client private key.\n\n### Configure collection variables\nThe variables\
    \ can be found when right-clicking and editing the collection.\n\n![alt text](/img/postman/v2/collection_variables.png)\n\
    \n### Variables\n* **x-api-key** and **clientId** can be found after selecting\
    \ an existing application under **[Applications](/applications)**.\n* **store-id**\
    \ The store id of the Third Party Provider. Here we can use *s-pankki*.\n* **callbackUrl**\
    \ one of the predefined redirect URLs for the application. The redirect URL used\
    \ in this tutorial is *https://oauth.pstmn.io/v1/callback* which is intended for\
    \ the Postman desktop application. If you are using Postman in a browser, use\
    \ *https://oauth.pstmn.io/v1/browser-callback* instead. Make sure the URL you\
    \ use is registered as a redirect URL in your Application on the Crosskey portal,\
    \ as the authorization server requires an exact match.\n* **digitalSignaturePrivateKey**\
    \ the private key of the Digital signature certificate.\n* **digitalSignatureCertificateSerialNumber**\
    \ the serial number **in decimal format** of the Digital signature certificate,\
    \ which is found from the Team page related to the application.\n* **digitalSignatureCertificate**\
    \ the public Digital signature certificate.\n\n## End-user authorization\nThis\
    \ request is referenced in below examples as **AUTH#2** and requires some manual\
    \ interactions between Postman and your browser. The request generates a URL,\
    \ to copy into your browser, where you can perform end user authorization. When\
    \ done, you're redirected back to your callback URL where you'll need to extract\
    \ the value from the fragment part code. Save it! as you'll need it for next request,\
    \ where it's provided as a query param.\n### Steps\n1. send the GET request.\n\
    2. open console in Postman.\n3. copy URL from console into your browser. (In this\
    \ example, *store-id* is set to 's-pankki'.)\n\n![alt text](/img/postman/v2/generated_url.png)\n\
    \n4. perform end user authorization. (Authentication credentials for your sandbox\
    \ subscriptions can be found at the [application  page](/applications))\n5. redirected\
    \ back to your callback.\n6. copy value from the callback URL fragment part **code**.\n\
    \n![alt text](/img/postman/callback_url.png)\n\n## Example\nRequires that you've\
    \ completed previous chapters.\nFor PISP you may choose a payment-order type from\
    \ the sub-folders, but the request flow below should apply to all. Please verify\
    \ that your subscribed API supports the chosen payment-order type.\nNot all payment\
    \ types are supported by every financial institution. Before testing, check the\
    \ API documentation for your specific bank to confirm which payment types are\
    \ available.\n\n**Note!** The payments access token cannot be refreshed, so **AUTH#4**\
    \ is not available as in other examples.\n\n### Request flow\n1. **AUTH#1** retrieve\
    \ access token.\n2. **PISP#1**  create payment consent.\n3. **AUTH#2** see [End-user\
    \ authorization](#end-user-authorization).\n4. **AUTH#3** exchange token, with\
    \ **authorization code** as query params.\n5. **PISP#2** fetches payment consent\
    \ (consent ID will be stored as a variable for step **PISP#3**) .\n6. **PISP#3**\
    \ confirm funds.\n7. **PISP#4** submits payment."
  version: "v3.1.7"
  x-crosskey-changelog:
    releases:
    - tag: "3.1.7"
      date: "2026-05-12"
      changes:
      - type: "breaking"
        name: "New creditor postal address requirements (SEPA payments)"
        description: "SEPA address payloads changed to structured/hybrid format (minimum\
          \ TownName + Country in dedicated fields); unstructured-only addresses are\
          \ now rejected to align with the EPC SEPA rulebook change effective 15 Nov\
          \ 2026. <br/><br/> When <code>Creditor/PostalAddress</code> is present:\
          \ <br/><br/> <ul> <li><code>BuildingNumber</code> MAY be present.</li> <li><code>Country</code>\
          \ <strong>MUST</strong> be present.</li> <li><code>CountrySubDivision</code>\
          \ MAY be present.</li> <li><code>PostCode</code> MAY be present.</li> <li><code>StreetName</code>\
          \ MAY be present</li> <li><code>TownName</code> <strong>MUST</strong> be\
          \ present.</li> <li> The payment will be rejected if any other postal address\
          \ fields are submitted that were previously allowed but are no longer supported.\
          \ </li> </ul>"
    - tag: "3.1.7"
      date: "2023-01-24"
      changes:
      - type: "feature"
        name: "Retrieve updated payment status"
        description: "For single immediate SEPA payments it is now possible to retrieve\
          \ the updated payment status from the endpoint <strong>https://s-pankki-api-sandbox.crosskey.io/open-banking/v3.1.7/pisp/international-payments/{InternationalPaymentId}</strong>.\
          \ Note that this change only affects the single immediate SEPA payments,\
          \ not single immediate SWIFT payments, scheduled SEPA payments nor standing\
          \ SEPA orders. <br/><br/> Supported status codes: <ul> <li><code>AcceptedSettlementCompleted</code>\
          \ Settlement on the debtor's account has been completed. PISPs <strong>must\
          \ not</strong> use this status as confirmation that settlement is complete\
          \ on the creditor's account.</li> <li><code>AcceptedSettlementInProcess</code>\
          \ All preceding checks such as technical validation and customer profile\
          \ were successful and therefore the payment initiation has been accepted\
          \ for execution.</li> <li><code>Pending</code> Payment initiation or individual\
          \ transaction included in the payment initiation is pending. Further checks\
          \ and status update will be performed.</li> <li><code>Rejected</code> Payment\
          \ initiation or individual transaction included in the payment initiation\
          \ has been rejected.</li> </ul> <br/> Detailed specification of the payment\
          \ order state model can be found <a href=\"https://openbankinguk.github.io/read-write-api-site3/v3.1.6/resources-and-data-models/pisp/international-payments.html#payment-order\"\
          >here</a>."
servers:
- url: "https://s-pankki-api-sandbox.crosskey.io/open-banking/v3.1.7/pisp"
tags:
- name: "International Payments"
  description: "Single immediate international payments can be initiated as either\
    \ SEPA, SEPA Instant or SWIFT payments.\nSupported request parameters and restrictions\
    \ per payment system:\n| Parameter                                           \
    \           | SEPA                                    | SEPA Instant         \
    \                               | SWIFT                                      \
    \    |\n |----------------------------------------------------------------|-----------------------------------------|-----------------------------------------------------|------------------------------------------------|\n\
    \ | Data/Initiation/ChargeBearer                                   | N/A     \
    \                                | N/A                                       \
    \          | Optional - `BorneByDebtor`, `Shared` (default) |\n | Data/Initiation/Creditor\
    \                                       | Optional                           \
    \     | Optional                                            | **Mandatory**  \
    \                                |\n | Data/Initiation/Creditor/Name         \
    \                         | Optional - Max70Text                    | Optional\
    \ - Max70Text                                | **Mandatory** - Max70Text     \
    \                 |\n | Data/Initiation/Creditor/PostalAddress               \
    \          | Optional                                | Optional              \
    \                              | **Mandatory**                               \
    \   |\n | Data/Initiation/Creditor/PostalAddress/BuildingNumber          | Optional\
    \ - Max16Text                    | Optional - Max16Text                      \
    \          | Optional - Max16Text                           |\n | Data/Initiation/Creditor/PostalAddress/Country\
    \                 | **Mandatory** - CountryCode             | **Mandatory** -\
    \ CountryCode                         | **Mandatory** - CountryCode          \
    \          |\n | Data/Initiation/Creditor/PostalAddress/CountrySubDivision   \
    \   | Optional - Max35Text                    | Optional - Max35Text         \
    \                       | Optional - Max35Text                           |\n |\
    \ Data/Initiation/Creditor/PostalAddress/PostCode                | Optional -\
    \ Max16Text                    | Optional - Max16Text                        \
    \        | Optional - Max16Text                           |\n | Data/Initiation/Creditor/PostalAddress/StreetName\
    \              | Optional - Max70Text                    | Optional - Max70Text\
    \                                | **Mandatory** - Max70Text                 \
    \     |\n | Data/Initiation/Creditor/PostalAddress/TownName                | **Mandatory**\
    \ - Max35Text               | **Mandatory** - Max35Text                      \
    \     | **Mandatory** - Max35Text                      |\n | Data/Initiation/CreditorAccount\
    \                                | **Mandatory**                           | **Mandatory**\
    \                                       | **Mandatory**                      \
    \            |\n | Data/Initiation/CreditorAccount/Identification            \
    \     | **Mandatory** - IBAN                    | **Mandatory** - IBAN       \
    \                         | **Mandatory** - Max34Text                      |\n\
    \ | Data/Initiation/CreditorAccount/Name                           | **Mandatory**\
    \ - Max70Text               | **Mandatory** - Max70Text                      \
    \     | **Mandatory** - Max70Text                      |\n | Data/Initiation/CreditorAccount/SchemeName\
    \                     | **Mandatory** - `UK.OBIE.IBAN`          | **Mandatory**\
    \ - `UK.OBIE.IBAN`                      | **Mandatory**                      \
    \            |\n | Data/Initiation/CreditorAgent                             \
    \     | Optional                                | N/A                        \
    \                         | **Mandatory**                                  |\n\
    \ | Data/Initiation/CreditorAgent/Identification                   | Optional\
    \                                | N/A                                       \
    \          | **Mandatory**                                  |\n | Data/Initiation/CreditorAgent/Name\
    \                             | Optional                                | N/A\
    \                                                 | **Mandatory**            \
    \                      |\n | Data/Initiation/CreditorAgent/PostalAddress     \
    \               | N/A                                     | N/A              \
    \                                   | Optional                               \
    \        |\n | Data/Initiation/CreditorAgent/PostalAddress/BuildingNumber    \
    \ | N/A                                     | N/A                            \
    \                     | Optional - Max16Text                           |\n | Data/Initiation/CreditorAgent/PostalAddress/Country\
    \            | N/A                                     | N/A                 \
    \                                | **Mandatory** - CountryCode               \
    \     |\n | Data/Initiation/CreditorAgent/PostalAddress/CountrySubDivision | N/A\
    \                                     | N/A                                  \
    \               | Optional - Max35Text                           |\n | Data/Initiation/CreditorAgent/PostalAddress/PostCode\
    \           | N/A                                     | N/A                  \
    \                               | Optional - Max16Text                       \
    \    |\n | Data/Initiation/CreditorAgent/PostalAddress/StreetName         | N/A\
    \                                     | N/A                                  \
    \               | **Mandatory** - Max70Text                      |\n | Data/Initiation/CreditorAgent/PostalAddress/TownName\
    \           | N/A                                     | N/A                  \
    \                               | **Mandatory** - Max35Text                  \
    \    |\n | Data/Initiation/CreditorAgent/SchemeName                       | Optional\
    \                                | N/A                                       \
    \          | **Mandatory** - `UK.OBIE.BICFI`                |\n | Data/Initiation/CurrencyOfTransfer\
    \                             | **Mandatory** - `EUR`                   | **Mandatory**\
    \ - `EUR`                               | **Mandatory**                      \
    \            |\n | Data/Initiation/DebtorAccount                             \
    \     | Optional                                | Optional                   \
    \                         | Optional                                       |\n\
    \ | Data/Initiation/DebtorAccount/Identification                   | **Mandatory**\
    \ - IBAN                    | **Mandatory** - IBAN                           \
    \     | **Mandatory**                                  |\n | Data/Initiation/DebtorAccount/SchemeName\
    \                       | **Mandatory** - `UK.OBIE.IBAN`          | **Mandatory**\
    \ - `UK.OBIE.IBAN`                      | **Mandatory**                      \
    \            |\n | Data/Initiation/EndToEndIdentification                    \
    \     | **Mandatory**                           | **Mandatory** - Max35Text  \
    \                         | **Mandatory**                                  |\n\
    \ | Data/Initiation/InstructedAmount                               | **Mandatory**\
    \                           | **Mandatory**                                  \
    \     | **Mandatory**                                  |\n | Data/Initiation/InstructedAmount/Amount\
    \                        | **Mandatory**                           | **Mandatory**\
    \                                       | **Mandatory**                      \
    \            |\n | Data/Initiation/InstructedAmount/Currency                 \
    \     | **Mandatory** - `EUR`                   | **Mandatory** - `EUR`      \
    \                         | **Mandatory**                                  |\n\
    \ | Data/Initiation/InstructionIdentification                      | **Mandatory**\
    \                           | **Mandatory**                                  \
    \     | **Mandatory**                                  |\n | Data/Initiation/InstructionPriority\
    \                            | N/A                                     | N/A \
    \                                                | Optional - `Normal` or `Urgent`\
    \                |\n | Data/Initiation/LocalInstrument                       \
    \         | Optional - `UK.OBIE.SEPACreditTransfer` | **Mandatory** - `UK.OBIE.SEPAInstantCreditTransfer`\
    \ | **Mandatory** - `UK.OBIE.SWIFT`                |\n | Data/Initiation/RemittanceInformation\
    \                          | Optional                                | Optional\
    \                                            | **Mandatory**                 \
    \                 |\n | Data/Initiation/RemittanceInformation/Reference      \
    \          | Optional                                | Optional - Max35Text  \
    \                              | **Mandatory** when `Unstructured` is not set\
    \   |\n | Data/Initiation/RemittanceInformation/Unstructured             | Optional\
    \                                | Optional - Max140Text                     \
    \          | **Mandatory** when `Reference` is not set      |\n | Risk       \
    \                                                    | **Mandatory**         \
    \                  | **Mandatory**                                       | **Mandatory**\
    \                                  |\n | Risk/MerchantCategoryCode           \
    \                           | Optional                                | Optional\
    \                                            | Optional                      \
    \                 |\n | Risk/MerchantCustomerIdentification                  \
    \          | Optional                                | Optional              \
    \                              | Optional                                    \
    \   |\n | Risk/PaymentContextCode                                        | Optional\
    \                                | Optional                                  \
    \          | Optional                                       |\n\n### Payment status\n\
    Detailed specification of the payment order state model can be found [here](https://openbankinguk.github.io/read-write-api-site3/v3.1.6/resources-and-data-models/pisp/international-payments.html#payment-order).\n\
    \n#### SEPA\nFor single immediate SEPA payments it is possible for PISPs to get\
    \ payment status updates after the payment initiation:\n- The payment status is\
    \ initially set to `Pending`. Further checks will then be performed, and payment\
    \ status updates can be requested using `GET https://s-pankki-api-sandbox.crosskey.io/open-banking/v3.1.7/pisp/international-payments/{InternationalPaymentId}`\n\
    - Payment status is set to `Rejected` if the payment for some reason is rejected\
    \ by the bank. This is a final state, so if you receive this status there is no\
    \ need to request further status updates.\n- Payment status is set to `AcceptedSettlementInProcess`\
    \ when the transaction has passed technical validations, but settlement is not\
    \ yet finalized at the payers's bank.\n- Payment status is set to `AcceptedSettlementCompleted`\
    \ when the payer's bank has completed all validations, the transaction has been\
    \ settled on the payer's account, and the payment is about to be sent to the beneficiary\
    \ bank. For SEPA credit transfers this is a final state, so if you have received\
    \ this status there is no need to request further status updates. Please note\
    \ that this status does not mean a beneficiary bank has completed settlement on\
    \ the payee's account.\nPlease note that payment status updates are only available\
    \ for the single immediate SEPA payments.\n\n#### SEPA Instant\nFor SEPA Instant\
    \ payments the final payment status is typically returned immediately and no further\
    \ polling for payment status is needed:\n- Payment status is set to `Pending`\
    \ if no status confirmation was received from the beneficiary PSP within required\
    \ time. Further checks will then be performed, and payment status updates can\
    \ be requested using `GET https://s-pankki-api-sandbox.crosskey.io/open-banking/v3.1.7/pisp/international-payments/{InternationalPaymentId}`\n\
    - Payment status is set to `Rejected` if the payment for some reason is rejected\
    \ by the bank.\n- Payment status is set to `AcceptedSettlementCompleted` when\
    \ settlement on the creditor's account has been completed. This applies exclusively\
    \ to bank internal payments.\n- Payment status is set to `AcceptedCreditSettlementCompleted`\
    \ when settlement on the creditor's account has been completed.\n\n#### SWIFT\n\
    For single immediate SWIFT payments the final payment status is immediately returned\
    \ and no further polling for payment status is needed."
- name: "International Scheduled Payments"
  description: "Scheduled international payments can be initiated as either SEPA or\
    \ SEPA Instant.\n\nSupported request parameters and restrictions per payment system:\n\
    \n| Parameter                                                 | SEPA         \
    \                           | SEPA Instant                                   \
    \     |\n |-----------------------------------------------------------|-----------------------------------------|-----------------------------------------------------|\n\
    \ | Data/Initiation/Creditor                                  | Optional     \
    \                           | Optional                                       \
    \     |\n | Data/Initiation/Creditor/Name                             | Optional\
    \ - Max70Text                    | Optional - Max70Text                      \
    \          |\n | Data/Initiation/Creditor/PostalAddress                    | Optional\
    \                                | Optional                                  \
    \          |\n | Data/Initiation/Creditor/PostalAddress/BuildingNumber     | Optional\
    \ - Max16Text                    | Optional - Max16Text                      \
    \          |\n | Data/Initiation/Creditor/PostalAddress/Country            | **Mandatory**\
    \ - CountryCode             | **Mandatory** - CountryCode                    \
    \     |\n | Data/Initiation/Creditor/PostalAddress/CountrySubDivision | Optional\
    \ - Max35Text                    | Optional - Max35Text                      \
    \          |\n | Data/Initiation/Creditor/PostalAddress/PostCode           | Optional\
    \ - Max16Text                    | Optional - Max16Text                      \
    \          |\n | Data/Initiation/Creditor/PostalAddress/StreetName         | Optional\
    \ - Max70Text                    | Optional - Max70Text                      \
    \          |\n | Data/Initiation/Creditor/PostalAddress/TownName           | **Mandatory**\
    \ - Max35Text               | **Mandatory** - Max35Text                      \
    \     |\n | Data/Initiation/CreditorAccount                           | **Mandatory**\
    \                           | **Mandatory**                                  \
    \     |\n | Data/Initiation/CreditorAccount/Identification            | **Mandatory**\
    \ - IBAN                    | **Mandatory** - IBAN                           \
    \     |\n | Data/Initiation/CreditorAccount/Name                      | **Mandatory**\
    \ - Max70Text               | **Mandatory** - Max70Text                      \
    \     |\n | Data/Initiation/CreditorAccount/SchemeName                | **Mandatory**\
    \ - `UK.OBIE.IBAN`          | **Mandatory** - `UK.OBIE.IBAN`                 \
    \     |\n | Data/Initiation/CurrencyOfTransfer                        | **Mandatory**\
    \ - `EUR`                   | **Mandatory** - `EUR`                          \
    \     |\n | Data/Initiation/DebtorAccount                             | Optional\
    \                                | Optional                                  \
    \          |\n | Data/Initiation/DebtorAccount/Identification              | **Mandatory**\
    \ - IBAN                    | **Mandatory** - IBAN                           \
    \     |\n | Data/Initiation/DebtorAccount/SchemeName                  | **Mandatory**\
    \ - `UK.OBIE.IBAN`          | **Mandatory** - `UK.OBIE.IBAN`                 \
    \     |\n | Data/Initiation/EndToEndIdentification                    | Optional\
    \ - Max35Text                    | Optional - Max35Text                      \
    \          |\n | Data/Initiation/InstructedAmount                          | **Mandatory**\
    \                           | **Mandatory**                                  \
    \     |\n | Data/Initiation/InstructedAmount/Amount                   | **Mandatory**\
    \                           | **Mandatory**                                  \
    \     |\n | Data/Initiation/InstructedAmount/Currency                 | **Mandatory**\
    \ - `EUR`                   | **Mandatory** - `EUR`                          \
    \     |\n | Data/Initiation/InstructionIdentification                 | **Mandatory**\
    \                           | **Mandatory**                                  \
    \     |\n | Data/Initiation/LocalInstrument                           | Optional\
    \ - `UK.OBIE.SEPACreditTransfer` | **Mandatory** - `UK.OBIE.SEPAInstantCreditTransfer`\
    \ |\n | Data/Initiation/RemittanceInformation                     | Optional \
    \                               | Optional                                   \
    \         |\n | Data/Initiation/RemittanceInformation/Reference           | Optional\
    \ - Max35Text                    | Optional - Max35Text                      \
    \          |\n | Data/Initiation/RemittanceInformation/Unstructured        | Optional\
    \ - Max140Text                   | Optional - Max140Text                     \
    \          |\n | Data/Initiation/RequestedExecutionDateTime                | **Mandatory**\
    \                           | **Mandatory**                                  \
    \     |\n | Risk                                                      | **Mandatory**\
    \                           | **Mandatory**                                  \
    \     |\n | Risk/MerchantCategoryCode                                 | Optional\
    \                                | Optional                                  \
    \          |\n | Risk/MerchantCustomerIdentification                       | Optional\
    \                                | Optional                                  \
    \          |\n | Risk/PaymentContextCode                                   | Optional\
    \                                | Optional                                  \
    \          |\n\n\n### Payment status\n\nSupported status codes: <ul> <li><code>InitiationCompleted</code>\
    \ The initiation of the payment order is complete.</li> <li><code>InitiationPending</code>\
    \ The initiation of the payment order is pending.</li> <li><code>InitiationFailed</code>\
    \ The initiation of the payment order has failed.</li> </ul>\n\nDetailed specification\
    \ of the payment order state model can be found [here](https://openbankinguk.github.io/read-write-api-site3/v3.1.6/resources-and-data-models/pisp/international-scheduled-payments.html#payment-order)."
- name: "International Standing Orders"
  description: "International standing orders can be set up for SEPA payments with\
    \ the following frequencies:\n* Once a month - the day in month of payment date\
    \ will be same for all payments executed by the standing order, or the following\
    \ banking day if the payment date is a non-banking day.\n* Last banking day each\
    \ month - the payment date will be the last banking day in every month.\n\nSupported\
    \ request parameters and restrictions per payment system:\n\n| Parameter     \
    \                                            | SEPA                          \
    \                           | SEPA Instant                                   \
    \          |\n |-----------------------------------------------------------|----------------------------------------------------------|----------------------------------------------------------|\n\
    \ | Data/Initiation/Creditor                                  | Optional     \
    \                                            | Optional                      \
    \                           |\n | Data/Initiation/Creditor/Name              \
    \               | Optional - Max70Text                                     | Optional\
    \ - Max70Text                                     |\n | Data/Initiation/Creditor/PostalAddress\
    \                    | Optional                                              \
    \   | Optional                                                 |\n | Data/Initiation/Creditor/PostalAddress/BuildingNumber\
    \     | Optional - Max16Text                                     | Optional -\
    \ Max16Text                                     |\n | Data/Initiation/Creditor/PostalAddress/Country\
    \            | **Mandatory** - CountryCode                              | **Mandatory**\
    \ - CountryCode                              |\n | Data/Initiation/Creditor/PostalAddress/CountrySubDivision\
    \ | Optional - Max35Text                                     | Optional - Max35Text\
    \                                     |\n | Data/Initiation/Creditor/PostalAddress/PostCode\
    \           | Optional - Max16Text                                     | Optional\
    \ - Max16Text                                     |\n | Data/Initiation/Creditor/PostalAddress/StreetName\
    \         | Optional - Max70Text                                     | Optional\
    \ - Max70Text                                     |\n | Data/Initiation/Creditor/PostalAddress/TownName\
    \           | **Mandatory** - Max35Text                                | **Mandatory**\
    \ - Max35Text                                |\n | Data/Initiation/CreditorAccount\
    \                           | **Mandatory**                                  \
    \          | **Mandatory**                                            |\n | Data/Initiation/CreditorAccount/Identification\
    \            | **Mandatory** - IBAN                                     | **Mandatory**\
    \ - IBAN                                     |\n | Data/Initiation/CreditorAccount/Name\
    \                      | **Mandatory** - Max70Text                           \
    \     | **Mandatory** - Max70Text                                |\n | Data/Initiation/CreditorAccount/SchemeName\
    \                | **Mandatory** - `UK.OBIE.IBAN`                           |\
    \ **Mandatory** - `UK.OBIE.IBAN`                           |\n | Data/Initiation/DebtorAccount\
    \                             | Optional                                     \
    \            | Optional                                                 |\n |\
    \ Data/Initiation/DebtorAccount/Identification              | **Mandatory** -\
    \ IBAN                                     | **Mandatory** - IBAN            \
    \                         |\n | Data/Initiation/DebtorAccount/SchemeName     \
    \             | **Mandatory** - `UK.OBIE.IBAN`                           | **Mandatory**\
    \ - `UK.OBIE.IBAN`                           |\n | Data/Initiation/FinalPaymentDateTime\
    \                      | Optional                                            \
    \     | Optional                                                 |\n | Data/Initiation/FirstPaymentDateTime\
    \                      | **Mandatory**                                       \
    \     | **Mandatory**                                            |\n | Data/Initiation/Frequency\
    \                                 | **Mandatory**                            \
    \                | **Mandatory**                                            |\n\
    \ | Data/Initiation/Frequency                                 | `EVERY_MONTH_LAST_BANKDAY`\
    \ - last banking day each month | `EVERY_MONTH_LAST_BANKDAY` - last banking day\
    \ each month |\n | Data/Initiation/Frequency                                 |\
    \ `EVERY_MONTH` - once a month                             | `EVERY_MONTH` - once\
    \ a month                             |\n | Data/Initiation/InstructedAmount \
    \                         | **Mandatory**                                    \
    \        | **Mandatory**                                            |\n | Data/Initiation/InstructedAmount/Amount\
    \                   | **Mandatory**                                          \
    \  | **Mandatory**                                            |\n | Data/Initiation/InstructedAmount/Currency\
    \                 | **Mandatory** - `EUR`                                    |\
    \ **Mandatory** - `EUR`                                    |\n | Data/Initiation/LocalInstrument\
    \                           | Optional - `UK.OBIE.SEPACreditTransfer`        \
    \          | **Mandatory** - `UK.OBIE.SEPAInstantCreditTransfer`      |\n | Data/Initiation/Reference\
    \                                 | Optional - Max35Text                     \
    \                | Optional - Max35Text                                     |\n\
    \ | Data/Initiation/Unstructured                              | Optional - Max140Text\
    \                                    | Optional - Max140Text                 \
    \                   |\n | Risk                                               \
    \       | **Mandatory**                                            | **Mandatory**\
    \                                            |\n | Risk/MerchantCategoryCode \
    \                                | Optional                                  \
    \               | Optional                                                 |\n\
    \ | Risk/MerchantCustomerIdentification                       | Optional     \
    \                                            | Optional                      \
    \                           |\n | Risk/PaymentContextCode                    \
    \               | Optional                                                 | Optional\
    \                                                 |\n\n\n### Payment status\n\n\
    Supported status codes: <ul> <li><code>InitiationCompleted</code> The initiation\
    \ of the payment order is complete.</li> <li><code>InitiationPending</code> The\
    \ initiation of the payment order is pending.</li> <li><code>InitiationFailed</code>\
    \ The initiation of the payment order has failed.</li> </ul>\n\nDetailed specification\
    \ of the payment order state model can be found [here](https://openbankinguk.github.io/read-write-api-site3/v3.1.6/resources-and-data-models/pisp/international-standing-orders.html#payment-order)."
