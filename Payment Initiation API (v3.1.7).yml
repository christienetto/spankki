                    SchemeName:
                      $ref: "#/components/schemas/OBExternalAccountIdentification4Code"
                    Identification:
                      $ref: "#/components/schemas/Identification_0"
                    Name:
                      type: "string"
                      description: "The account name is the name or names of the account\
                        \ owner(s) represented at an account level, as displayed by\
                        \ the ASPSP's online channels.\nNote, the account name is\
                        \ not the product name or the nickname of the account."
                      maxLength: 350
                      minLength: 1
                    SecondaryIdentification:
                      $ref: "#/components/schemas/SecondaryIdentification"
                  required:
                  - "Identification"
                  - "SchemeName"
                Creditor:
                  type: "object"
                  description: "Party to which an amount of money is due."
                  properties:
                    Name:
                      type: "string"
                      description: "Name by which a party is known and which is usually\
                        \ used to identify that party."
                      maxLength: 140
                      minLength: 1
                    PostalAddress:
                      $ref: "#/components/schemas/OBPostalAddress6"
                CreditorAgent:
                  type: "object"
                  description: "Financial institution servicing an account for the\
                    \ creditor."
                  properties:
                    SchemeName:
                      $ref: "#/components/schemas/OBExternalFinancialInstitutionIdentification4Code"
                    Identification:
                      $ref: "#/components/schemas/Identification_1"
                    Name:
                      $ref: "#/components/schemas/Name"
                    PostalAddress:
                      $ref: "#/components/schemas/OBPostalAddress6"
                CreditorAccount:
                  type: "object"
                  description: "Unambiguous identification of the account of the creditor\
                    \ to which a credit entry will be posted as a result of the payment\
                    \ transaction."
                  properties:
                    SchemeName:
                      $ref: "#/components/schemas/OBExternalAccountIdentification4Code"
                    Identification:
                      $ref: "#/components/schemas/Identification_0"
                    Name:
                      type: "string"
                      description: "The account name is the name or names of the account\
                        \ owner(s) represented at an account level.\nNote, the account\
                        \ name is not the product name or the nickname of the account.\n\
                        OB: ASPSPs may carry out name validation for Confirmation\
                        \ of Payee, but it is not mandatory."
                      maxLength: 350
                      minLength: 1
                    SecondaryIdentification:
                      $ref: "#/components/schemas/SecondaryIdentification"
                  required:
                  - "Identification"
                  - "Name"
                  - "SchemeName"
                RemittanceInformation:
                  type: "object"
                  description: "Information supplied to enable the matching of an\
                    \ entry with the items that the transfer is intended to settle,\
                    \ such as commercial invoices in an accounts' receivable system."
                  properties:
                    Unstructured:
                      type: "string"
                      description: "Information supplied to enable the matching/reconciliation\
                        \ of an entry with the items that the payment is intended\
                        \ to settle, such as commercial invoices in an accounts' receivable\
                        \ system, in an unstructured form."
                      maxLength: 140
                      minLength: 1
                    Reference:
                      type: "string"
                      description: "Unique reference, as assigned by the creditor,\
                        \ to unambiguously refer to the payment transaction.\nUsage:\
                        \ If available, the initiating party should provide this reference\
                        \ in the structured remittance information, to enable reconciliation\
                        \ by the creditor upon receipt of the amount of money.\nIf\
                        \ the business context requires the use of a creditor reference\
                        \ or a payment remit identification, and only one identifier\
                        \ can be passed through the end-to-end chain, the creditor's\
                        \ reference or payment remittance identification should be\
                        \ quoted in the end-to-end transaction identification.\nOB:\
                        \ The Faster Payments Scheme can only accept 18 characters\
                        \ for the ReferenceInformation field - which is where this\
                        \ ISO field will be mapped."
                      maxLength: 35
                      minLength: 1
                SupplementaryData:
                  $ref: "#/components/schemas/OBSupplementaryData1"
              required:
              - "CreditorAccount"
              - "CurrencyOfTransfer"
              - "InstructedAmount"
              - "InstructionIdentification"
              - "RequestedExecutionDateTime"
          required:
          - "ConsentId"
          - "Initiation"
        Risk:
          $ref: "#/components/schemas/OBRisk1"
