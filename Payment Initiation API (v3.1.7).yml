                  type: "string"
                  description: "Number of the payments that will be made in completing\
                    \ this frequency sequence including any executed since the sequence\
                    \ start date."
                  maxLength: 35
                  minLength: 1
                FirstPaymentDateTime:
                  type: "string"
                  format: "date-time"
                  description: "The date on which the first payment for a Standing\
                    \ Order schedule will be made.All dates in the JSON payloads are\
